# Nord theme for i3
# Colors
set $bg      #2e3440
set $fg      #eceff4
set $focused #88c0d0
set $inactive #4c566a
set $urgent  #bf616a

# Window Decorations
# class                 border    backgr    text    indicator child_border
client.focused          $focused  $focused  $fg     $focused  $focused
client.focused_inactive $inactive $inactive $fg     $inactive $inactive
client.unfocused        $inactive $inactive $fg     $inactive $inactive
client.urgent           $urgent   $urgent   $fg     $urgent   $urgent
client.placeholder      #000000   #0c0c0c   $fg     #000000   #0c0c0c
client.background       $bg
